<svg viewBox="0 0 760 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t426823 d426823"><title id="t426823">Exact scaling schedule for g = 31</title><desc id="d426823">Carries of sizes 2^2, 2^2 and 2 make one period of 33 steps; the exponent of 2 in L rises by 5 per period, so the orbit scales by 1024 each period.</desc><defs><marker id="ar426823" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab3d4"/></marker></defs><rect width="760" height="372" fill="#0a0b14" rx="10"/><text x="380.0" y="26.0" fill="#dde0ee" font-size="15" text-anchor="middle" font-weight="700" >Exact scaling for g = 31: one active prime, one fixed period</text><rect x="70.0" y="50" width="143.5" height="40" rx="4" fill="#38bdf8" fill-opacity=".5" stroke="#38bdf8"/><text x="141.7" y="67.0" fill="#fff" font-size="14" text-anchor="middle" font-weight="800" >2²</text><text x="141.7" y="83.0" fill="#e4e8f8" font-size="11.5" text-anchor="middle" font-weight="400" >15 steps</text><rect x="215.5" y="50" width="143.5" height="40" rx="4" fill="#4ecdc4" fill-opacity=".5" stroke="#4ecdc4"/><text x="287.2" y="67.0" fill="#fff" font-size="14" text-anchor="middle" font-weight="800" >2²</text><text x="287.2" y="83.0" fill="#e4e8f8" font-size="11.5" text-anchor="middle" font-weight="400" >15 steps</text><rect x="360.9" y="50" width="27.1" height="40" rx="4" fill="#c084fc" fill-opacity=".5" stroke="#c084fc"/><text x="374.5" y="67.0" fill="#fff" font-size="14" text-anchor="middle" font-weight="800" >2</text><text x="374.5" y="83.0" fill="#e4e8f8" font-size="11.5" text-anchor="middle" font-weight="400" >3</text><text x="230.0" y="44.0" fill="#aab3d4" font-size="12.5" text-anchor="middle" font-weight="600" >period 1: P = 33</text><rect x="390.0" y="50" width="143.5" height="40" rx="4" fill="#38bdf8" fill-opacity=".5" stroke="#38bdf8"/><text x="461.7" y="67.0" fill="#fff" font-size="14" text-anchor="middle" font-weight="800" >2²</text><text x="461.7" y="83.0" fill="#e4e8f8" font-size="11.5" text-anchor="middle" font-weight="400" >15 steps</text><rect x="535.5" y="50" width="143.5" height="40" rx="4" fill="#4ecdc4" fill-opacity=".5" stroke="#4ecdc4"/><text x="607.2" y="67.0" fill="#fff" font-size="14" text-anchor="middle" font-weight="800" >2²</text><text x="607.2" y="83.0" fill="#e4e8f8" font-size="11.5" text-anchor="middle" font-weight="400" >15 steps</text><rect x="680.9" y="50" width="27.1" height="40" rx="4" fill="#c084fc" fill-opacity=".5" stroke="#c084fc"/><text x="694.5" y="67.0" fill="#fff" font-size="14" text-anchor="middle" font-weight="800" >2</text><text x="694.5" y="83.0" fill="#e4e8f8" font-size="11.5" text-anchor="middle" font-weight="400" >3</text><text x="550.0" y="44.0" fill="#aab3d4" font-size="12.5" text-anchor="middle" font-weight="600" >period 2: P = 33</text><line x1="70" y1="330" x2="710" y2="330" stroke="#3a4468"/><line x1="70" y1="120" x2="70" y2="330" stroke="#3a4468"/><line x1="70" y1="330.0" x2="710" y2="330.0" stroke="#1a1e36"/><text x="62.0" y="334.0" fill="#7e8bb0" font-size="12" text-anchor="end" font-weight="400" >0</text><line x1="70" y1="290.0" x2="710" y2="290.0" stroke="#1a1e36"/><text x="62.0" y="294.0" fill="#7e8bb0" font-size="12" text-anchor="end" font-weight="400" >2</text><line x1="70" y1="250.0" x2="710" y2="250.0" stroke="#1a1e36"/><text x="62.0" y="254.0" fill="#7e8bb0" font-size="12" text-anchor="end" font-weight="400" >4</text><line x1="70" y1="210.0" x2="710" y2="210.0" stroke="#1a1e36"/><text x="62.0" y="214.0" fill="#7e8bb0" font-size="12" text-anchor="end" font-weight="400" >6</text><line x1="70" y1="170.0" x2="710" y2="170.0" stroke="#1a1e36"/><text x="62.0" y="174.0" fill="#7e8bb0" font-size="12" text-anchor="end" font-weight="400" >8</text><line x1="70" y1="130.0" x2="710" y2="130.0" stroke="#1a1e36"/><text x="62.0" y="134.0" fill="#7e8bb0" font-size="12" text-anchor="end" font-weight="400" >10</text><path d="M70.0,330.0 L215.5,330.0 L215.5,290.0 L360.9,290.0 L360.9,250.0 L390.0,250.0 L390.0,230.0 L535.5,230.0 L535.5,190.0 L680.9,190.0 L680.9,150.0 L710.0,150.0 L710.0,130.0" fill="none" stroke="#fbbf24" stroke-width="2.6" stroke-linejoin="round"/><circle cx="215.5" cy="330.0" r="3.5" fill="#fbbf24"/><circle cx="360.9" cy="290.0" r="3.5" fill="#fbbf24"/><circle cx="390.0" cy="250.0" r="3.5" fill="#fbbf24"/><circle cx="535.5" cy="230.0" r="3.5" fill="#fbbf24"/><circle cx="680.9" cy="190.0" r="3.5" fill="#fbbf24"/><circle cx="710.0" cy="150.0" r="3.5" fill="#fbbf24"/><text x="390.0" y="358.0" fill="#7e8bb0" font-size="12.5" text-anchor="middle" font-weight="400" >γ-steps along the orbit</text><text x="62.0" y="112.0" fill="#7e8bb0" font-size="12.5" text-anchor="start" font-weight="400" >exponent of 2 in L</text><text x="94.0" y="176.0" fill="#fbbf24" font-size="14" text-anchor="start" font-weight="700" >each period: exponent +5, so L × 2⁵ = 32</text><text x="94.0" y="200.0" fill="#fff4cc" font-size="15" text-anchor="start" font-weight="800" >x(n+33) = ρ² x(n),  ρ = 2⁵,  ρ² = 1,024</text></svg>