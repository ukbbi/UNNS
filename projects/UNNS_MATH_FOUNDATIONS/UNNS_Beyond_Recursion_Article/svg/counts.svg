<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t784082 d784082"><title id="t784082">Values, routes and histories up to 5000</title><desc id="d784082">5,000 integer values, 3,124 routes and 8,283 complete histories for integers up to 5,000.</desc><defs><marker id="ar784082" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab3d4"/></marker></defs><rect width="760" height="260" fill="#0a0b14" rx="10"/><text x="380.0" y="28.0" fill="#dde0ee" font-size="15" text-anchor="middle" font-weight="700" >Counting every integer up to 5,000</text><text x="150.0" y="76.0" fill="#aab3d4" font-size="14" text-anchor="end" font-weight="600" >integer values</text><rect x="162" y="56" width="283.7" height="30" rx="4" fill="#38bdf8" fill-opacity=".55" stroke="#38bdf8"/><text x="453.7" y="77.0" fill="#38bdf8" font-size="16" text-anchor="start" font-weight="800" >5,000</text><text x="162.0" y="104.0" fill="#7e8bb0" font-size="12" text-anchor="start" font-weight="400" >the numbers themselves</text><text x="150.0" y="140.0" fill="#aab3d4" font-size="14" text-anchor="end" font-weight="600" >routes</text><rect x="162" y="120" width="177.3" height="30" rx="4" fill="#4ecdc4" fill-opacity=".55" stroke="#4ecdc4"/><text x="347.3" y="141.0" fill="#4ecdc4" font-size="16" text-anchor="start" font-weight="800" >3,124</text><text x="162.0" y="168.0" fill="#7e8bb0" font-size="12" text-anchor="start" font-weight="400" >incoming edges: distinct generating steps</text><text x="150.0" y="204.0" fill="#aab3d4" font-size="14" text-anchor="end" font-weight="600" >complete histories</text><rect x="162" y="184" width="470.0" height="30" rx="4" fill="#fbbf24" fill-opacity=".55" stroke="#fbbf24"/><text x="640.0" y="205.0" fill="#fbbf24" font-size="16" text-anchor="start" font-weight="800" >8,283</text><text x="162.0" y="232.0" fill="#7e8bb0" font-size="12" text-anchor="start" font-weight=