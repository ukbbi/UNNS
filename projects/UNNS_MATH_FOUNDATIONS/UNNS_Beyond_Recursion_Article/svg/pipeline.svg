<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t762957 d762957"><title id="t762957">Certified dynamics analyzer pipeline</title><desc id="d762957">Six stages from a rational input state through fibre invariants, carry calculus, survivor selection and a static certificate to the output scaling law with an explicit transient bound.</desc><defs><marker id="ar762957" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab3d4"/></marker></defs><rect width="760" height="372" fill="#0a0b14" rx="10"/><path d="M252,111.0 L273,111.0" stroke="#aab3d4" stroke-width="2" marker-end="url(#ar762957)"/><path d="M499,111.0 L520,111.0" stroke="#aab3d4" stroke-width="2" marker-end="url(#ar762957)"/><path d="M634.0,166 L634.0,180 L140.0,180 L140.0,194" fill="none" stroke="#aab3d4" stroke-width="2" marker-end="url(#ar762957)"/><path d="M252,251.0 L273,251.0" stroke="#aab3d4" stroke-width="2" marker-end="url(#ar762957)"/><path d="M499,251.0 L520,251.0" stroke="#aab3d4" stroke-width="2" marker-end="url(#ar762957)"/><text x="380.0" y="26.0" fill="#dde0ee" font-size="15" text-anchor="middle" font-weight="700" >A certified dynamics analyzer: from a rational state to a certificate</text><rect x="30" y="56" width="220" height="110" rx="10" fill="#10122a" stroke="#38bdf8" stroke-width="2"/><rect x="30" y="56" width="220" height="6" rx="3" fill="#38bdf8"/><text x="44.0" y="88.0" fill="#38bdf8" font-size="15" text-anchor="start" font-weight="800" >1  Input</text><text x="44.0" y="116.0" fill="#ffffff" font-size="14" text-anchor="start" font-weight="600" >a rational state x₀</text><text x="44.0" y="142.0" fill="#aab3d4" font-size="12.5" text-anchor="start" font-weight="400" >any x₀ in the system</text><rect x="277" y="56" width="220" height="110" rx="10" fill="#10122a" stroke="#4ecdc4" stroke-width="2"/><rect x="277" y="56" width="220" height="6" rx="3" fill="#4ecdc4"/><text x="291.0" y="88.0" fill="#4ecdc4" font-size="15" text-anchor="start" font-weight="800" >2  Fibre invariants</text><text x="291.0" y="116.0" fill="#ffffff" font-size="14" text-anchor="start" font-weight="600" >D(x), L, G, γ</text><text x="291.0" y="142.0" fill="#aab3d4" font-size="12.5" text-anchor="start" font-weight="400" >T1 · γ-framework</text><rect x="524" y="56" width="220" height="110" rx="10" fill="#10122a" stroke="#4ade80" stroke-width="2"/><rect x="524" y="56" width="220" height="6" rx="3" fill="#4ade80"/><text x="538.0" y="88.0" fill="#4ade80" font-size="15" text-anchor="start" font-weight="800" >3  Carry calculus</text><text x="538.0" y="116.0" fill="#ffffff" font-size="14" text-anchor="start" font-weight="600" >scheduler and odometers</text><text x="538.0" y="142.0" fill="#aab3d4" font-size="12.5" text-anchor="start" font-weight="400" >T56 · T59 · T60</text><rect x="30" y="196" width="220" height="110" rx="10" fill="#10122a" stroke="#fbbf24" stroke-width="2"/><rect x="30" y="196" width="220" height="6" rx="3" fill="#fbbf24"/><text x="44.0" y="228.0" fill="#fbbf24" font-size="15" text-anchor="start" font-weight="800" >4  Survivor</text><text x="44.0" y="256.0" fill="#ffffff" font-size="14" text-anchor="start" font-weight="600" >minimax selection</text><text x="44.0" y="282.0" fill="#aab3d4" font-size="12.5" text-anchor="start" font-weight="400" >T64 · T65 · T67</text><rect x="277" y="196" width="220" height="110" rx="10" fill="#10122a" stroke="#fb923c" stroke-width="2"/><rect x="277" y="196" width="220" height="6" rx="3" fill="#fb923c"/><text x="291.0" y="228.0" fill="#fb923c" font-size="15" text-anchor="start" font-weight="800" >5  Certificate</text><text x="291.0" y="256.0" fill="#ffffff" font-size="14" text-anchor="start" font-weight="600" >static survivor test S3–S5</text><text x="291.0" y="282.0" fill="#aab3d4" font-size="12.5" text-anchor="start" font-weight="400" >T66 · proved for prime g</text><rect x="524" y="196" width="220" height="110" rx="10" fill="#10122a" stroke="#c084fc" stroke-width="2"/><rect x="524" y="196" width="220" height="6" rx="3" fill="#c084fc"/><text x="538.0" y="228.0" fill="#c084fc" font-size="15" text-anchor="start" font-weight="800" >6  Output</text><text x="538.0" y="256.0" fill="#ffffff" font-size="14" text-anchor="start" font-weight="600" >x(n+P) = ρ² x(n)</text><text x="538.0" y="282.0" fill="#aab3d4" font-size="12.5" text-anchor="start" font-weight="400" >ρ = pˢ, plus bound T69–T72</text><text x="380.0" y="330.0" fill="#aab3d4" font-size="13" text-anchor="middle" font-weight="400" >Status: the mathematics certifies behaviour inside the selected system;</text><text x="380.0" y="350.0" fill="#aab3d4" font-size="13" text-anchor="middle" font-weight="400" >measured advantage and transfer to outside systems are research questions.</text></svg>