<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNNS Common Refinement — Research Analytics</title>
<style>
:root{
  --bg:#040810;--bg2:#060c16;--panel:#07101e;--panel2:#0a1628;
  --border:#0e2035;--border2:#0c1a2e;
  --accent:#00c8f0;--green:#00dd88;--amber:#f0a030;--red:#e04040;
  --blue:#4ab0f0;--violet:#9060e0;--gold:#d4a020;--coral:#e06040;
  --text:#b8cce0;--text2:#6080a0;--dim:#3a5070;
  --sans:'Trebuchet MS',sans-serif;--mono:'Courier New',monospace;--display:'Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.6}
.shell{max-width:1440px;margin:0 auto;padding:32px 32px 120px}

.hero{border-bottom:1px solid var(--border);padding-bottom:24px;margin-bottom:24px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 50% 120% at 90% 50%,rgba(0,200,240,.06),transparent);pointer-events:none}
.hero-eye{font-size:8px;color:var(--text2);letter-spacing:.18em;font-weight:700;margin-bottom:10px;font-family:var(--mono)}
.hero h1{font-family:var(--display);font-size:clamp(18px,2.8vw,30px);color:var(--accent);letter-spacing:.06em;line-height:1.1;margin-bottom:8px}
.hero-sub{font-size:12px;color:var(--text2);letter-spacing:.04em;max-width:760px;margin-bottom:14px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.badge{font-size:8px;font-family:var(--mono);letter-spacing:.1em;padding:3px 10px;border:1px solid;border-radius:2px}
.b-green{color:var(--green);border-color:var(--green);background:rgba(0,221,136,.07)}
.b-blue{color:var(--blue);border-color:var(--blue);background:rgba(74,176,240,.07)}
.b-amber{color:var(--amber);border-color:var(--amber);background:rgba(240,160,48,.07)}
.b-violet{color:var(--violet);border-color:var(--violet);background:rgba(144,96,224,.07)}
.b-red{color:var(--red);border-color:var(--red);background:rgba(224,64,64,.07)}
.b-dim{color:var(--dim);border-color:var(--dim);background:transparent}

.tabbar{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--border);margin-bottom:22px;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:4px}
.tab{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--text2);padding:10px 14px;cursor:pointer;border:1px solid transparent;border-bottom:none;background:var(--panel);white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-color:var(--border2);background:var(--panel2);position:relative}
.tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--panel2)}
.tabpanel{display:none}
.tabpanel.active{display:block}

.sec-label{font-size:8px;color:var(--dim);letter-spacing:.2em;font-weight:700;padding:5px 0 10px;border-top:1px solid var(--border2);margin-top:32px;margin-bottom:16px;display:flex;align-items:center;gap:12px;font-family:var(--mono)}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border2)}
.sec-label:first-child{margin-top:0;border-top:none}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--border2);padding:12px 14px}
.stat-val{font-family:var(--display);font-size:20px;line-height:1.15;margin-bottom:3px}
.stat-lbl{font-size:8px;color:var(--text2);letter-spacing:.06em;font-family:var(--mono)}

.panel{background:var(--panel);border:1px solid var(--border2);padding:16px 20px;margin-bottom:14px}
.panel-title{font-size:8px;color:var(--accent);letter-spacing:.14em;font-weight:700;border-bottom:1px solid var(--border2);padding-bottom:8px;margin-bottom:12px;font-family:var(--mono);display:flex;justify-content:space-between;align-items:center}
.psub{color:var(--dim);font-weight:400;text-transform:none;letter-spacing:0}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:1000px){.row2,.row3{grid-template-columns:1fr}}

.scrollbox{overflow-x:auto;border:1px solid var(--border2)}
.dt{width:100%;border-collapse:collapse;font-size:9.5px}
.dt th{color:var(--accent);letter-spacing:.08em;font-weight:700;padding:6px 10px;border-bottom:1px solid var(--border2);text-align:left;white-space:nowrap;background:var(--panel2);font-family:var(--mono);position:sticky;top:0}
.dt td{padding:5px 10px;border-bottom:1px solid var(--border2);font-family:var(--mono);white-space:nowrap}
.dt tr:hover td{background:rgba(0,200,240,.04)}
.dt tr.clickable{cursor:pointer}
.dt tr.expanded td{background:rgba(0,200,240,.06)}

.v-yes{color:var(--green);font-weight:700}
.v-no{color:var(--red);font-weight:700}
.v-pass{color:var(--green);border:1px solid var(--green);background:rgba(0,221,136,.08);padding:2px 7px;border-radius:2px;font-size:8px;letter-spacing:.08em}
.v-partial{color:var(--amber);border:1px solid var(--amber);background:rgba(240,160,48,.08);padding:2px 7px;border-radius:2px;font-size:8px;letter-spacing:.08em}
.v-open{color:var(--red);border:1px solid var(--red);background:rgba(224,64,64,.08);padding:2px 7px;border-radius:2px;font-size:8px;letter-spacing:.08em}
.v-full{color:var(--green)}
.v-frag{color:var(--red)}
.v-tail{color:var(--amber)}

.detail-row td{background:var(--panel2);font-family:var(--sans);font-size:10.5px;white-space:normal;padding:14px 16px}
.detail-grid{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;font-size:10px}
.detail-grid dt{color:var(--dim);font-family:var(--mono);letter-spacing:.06em}
.detail-grid dd{color:var(--text)}

.ladder{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.ladder-step{display:grid;grid-template-columns:230px auto 1fr;gap:12px;align-items:center;padding:9px 14px;border:1px solid var(--border2);background:var(--panel2)}
.ladder-lv{font-family:var(--display);font-size:11px;color:var(--text)}
.ladder-desc{font-size:9.5px;color:var(--text2)}
.ladder-tag{font-size:8px;font-family:var(--mono);letter-spacing:.08em;padding:2px 8px;border-radius:2px;white-space:nowrap}
@media(max-width:900px){.ladder-step{grid-template-columns:1fr}}

.pipeline{display:flex;flex-wrap:wrap;align-items:center;gap:0;font-family:var(--mono);font-size:8.5px;margin:10px 0}
.pipe-step{background:var(--panel2);border:1px solid var(--border2);padding:6px 10px;color:var(--text)}
.pipe-step.active{border-color:var(--accent);color:var(--accent)}
.pipe-arrow{color:var(--dim);padding:0 6px}

.special-banner{border:1px solid var(--amber);border-left:3px solid var(--amber);background:rgba(240,160,48,.05);padding:12px 16px;margin-bottom:14px}
.special-title{font-size:12px;font-weight:700;color:var(--amber);margin-bottom:5px;font-family:var(--mono)}
.special-banner.violet{border-color:var(--violet)}
.special-banner.violet .special-title{color:var(--violet)}
.special-banner.green{border-color:var(--green)}
.special-banner.green .special-title{color:var(--green)}

.caution{font-size:9px;color:var(--dim);border-top:1px solid var(--border2);margin-top:10px;padding-top:8px;font-family:var(--mono)}

.svgpanel{width:100%;height:170px;background:var(--panel2);border:1px solid var(--border2)}

.drawer-btn{font-family:var(--mono);font-size:8px;letter-spacing:.08em;color:var(--text2);border:1px solid var(--border2);background:transparent;padding:2px 8px;cursor:pointer;border-radius:2px}
.drawer-btn:hover{color:var(--accent);border-color:var(--accent)}
.drawer{display:none;background:var(--bg2);border:1px solid var(--border2);border-left:3px solid var(--accent);padding:10px 14px;margin-top:8px;font-family:var(--mono);font-size:9.5px;color:var(--text2);line-height:1.9}
.drawer.open{display:block}
.drawer b{color:var(--accent);font-weight:400}

.buildcard{background:var(--panel2);border:1px solid var(--border2);padding:14px 16px}
.buildcard .jobs{font-family:var(--display);font-size:22px;color:var(--accent)}
.buildcard .lbl{font-size:9.5px;color:var(--text);margin:4px 0}
.buildcard .cmd{font-size:8.5px;color:var(--text2);word-break:break-all}

.chip{font-size:8px;font-family:var(--mono);padding:1px 6px;border:1px solid var(--border2);border-radius:2px;color:var(--text2)}

.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:8.5px;font-family:var(--mono);color:var(--text2);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;display:inline-block;border-radius:1px}

footer.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--border2);font-size:8px;color:var(--dim);font-family:var(--mono);line-height:1.8}
</style>
</head>

function esc(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function fmt(n, digits){ if(n===null||n===undefined||Number.isNaN(n)) return '—'; if(typeof n!=='number') return esc(n); return n.toFixed(digits===undefined?4:digits); }
function fmtInt(n){ if(n===null||n===undefined) return '—'; return Number(n).toLocaleString(); }

// ---------- generic SOURCE drawer (used across §1–§5) ----------
const PROV = {};
(DATA.reproducibility.provenance||[]).forEach(p=>{ PROV[p.path]=p; });
let __drawerSeq = 0;
function sourceDrawer(paths){
  if(!paths || !paths.length) return {btn:'', drawer:''};
  const id = 'src-'+(__drawerSeq++);
  const rows = paths.map(p=>{
    const info = PROV[p];
    return info
      ? `${esc(p)} — sha256 ${esc(info.sha256.slice(0,16))}… (${fmtInt(info.bytes)} bytes)`
      : `${esc(p)} — (not in provenance manifest)`;
  }).join('<br>');
  const btn = `<button class="drawer-btn" onclick="toggleDrawer('${id}')">SOURCE</button>`;
  // Neutral provenance status for general result/theorem records. "Frozen input
  // verification: PASS" is reserved for the actual frozen admissibility–percolation
  // chamber/corpus records (§5), which state that explicitly in their own drawers.
  const drawer = `<div class="drawer" id="${id}"><b>Source:</b><br>${rows}<br>`+
    `<b>Build:</b> ${esc(DATA.reproducibility.build_timestamp_utc)}<br>`+
    `<b>Source manifest:</b> PRESENT<br>`+
    `<b>Build provenance:</b> HASHED</div>`;
  return {btn, drawer};
}

function svgFiniteCoreTail(){
  let s = `<line x1="10" y1="130" x2="290" y2="130" stroke="#0e2035" stroke-width="1"/>`;

  s += `<text x="185" y="150" font-size="7" fill="#00dd88" font-family="monospace">primal tail →</text>`;
  s += `<text x="10" y="30" font-size="8" fill="#6080a0" font-family="monospace">H = ⟨2,3⟩-type numerical monoid, elements left→right</text>`;
  return s;
}
function svgPersistentRay(){
  let s = `<line x1="10" y1="130" x2="290" y2="130" stroke="#0e2035" stroke-width="1"/>`;
  for(let x=30; x<=270; x+=22){ s+=`<circle cx="${x}" cy="130" r="4" fill="#e04040"/>`; }

  s += `<text x="90" y="150" font-size="7" fill="#e04040" font-family="monospace">a + nρ, n = 0,1,2,… (never terminates)</text>`;
  s += `<text x="10" y="30" font-size="8" fill="#6080a0" font-family="monospace">affine ray, rank(H) ≥ 2, ARD(H) &gt; 0</text>`;
  return s;
}
function svgDescentStaircase(nSteps){
  nSteps = nSteps || 9;
  let s = '';
  const w = 300, h = 170, padX = 20, padY = 25, stepW = (w-2*padX)/nSteps, stepH = (h-2*padY)/nSteps;
  for(let i=0;i<nSteps;i++){
    const x = padX + i*stepW, y = padY + i*stepH;
    const color = i===nSteps-1 ? '#00dd88' : '#9060e0';
    s += `<rect x="${x}" y="${y}" width="${stepW*0.9}" height="6" fill="${color}"/>`;
    if(i<nSteps-1){ s += `<line x1="${x+stepW*0.45}" y1="${y+6}" x2="${x+stepW*0.45}" y2="${y+stepH}" stroke="#0e2035" stroke-width="1" stroke-dasharray="2,2"/>`; }
  }
  s += `<text x="20" y="14" font-size="8" fill="#6080a0" font-family="monospace">support-class order type ↓ at each step</text>`;
  s += `<text x="${padX}" y="${h-6}" font-size="7" fill="#00dd88" font-family="monospace">primal base reached</text>`;
  return s;
}

function verdictClass(v){
  if(!v) return '';
  if(/FULL_PERC/.test(v)) return 'v-full';
  if(/HARD_FRAG/.test(v)) return 'v-frag';
  if(/TAIL_FRAG/.test(v)) return 'v-tail';
  return '';
}
const CLASS_COLORS = {INT_FREE:'#4ab0f0', R1_FREE:'#00dd88', R1_FAIL:'#e04040', AFF_FREE:'#d4a020', AFF_FAIL:'#9060e0'};

function chartScatterPanel(cases){
  const pts = cases.filter(c=>c.mean_rho!=null && c.kappa_connect_exact!=null);
  const maxRho = Math.max(...pts.map(p=>p.mean_rho), 0.001);
  const maxK = Math.max(...pts.map(p=>p.kappa_connect_exact), 0.001);
  const W=300,H=190,padL=34,padB=26,padT=14,padR=10;
  const sx = x => padL + (x/maxRho)*(W-padL-padR);
  const sy = y => H-padB - (y/maxK)*(H-padT-padB);
  let s = `<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#0e2035"/>`;
  s += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#0e2035"/>`;
  pts.forEach(p=>{
    s += `<circle cx="${sx(p.mean_rho).toFixed(1)}" cy="${sy(p.kappa_connect_exact).toFixed(1)}" r="3.4" fill="${CLASS_COLORS[p.class]||'#6080a0'}" fill-opacity="0.85"><title>${p.case_id}</title></circle>`;
  });
  s += `<text x="${padL}" y="${H-8}" font-size="7" fill="#6080a0" font-family="monospace">mean ρ →</text>`;
  s += `<text x="4" y="${padT+6}" font-size="7" fill="#6080a0" font-family="monospace">κ_exact</text>`;
  let panel = `<div class="panel"><div class="panel-title">mean ρ vs κ_connect_exact <button class="drawer-btn" onclick="toggleDrawer('drawer-c1')">SOURCE</button></div>`;
  panel += `<svg class="svgpanel" viewBox="0 0 ${W} ${H}">${s}</svg>`;
  panel += classLegend();
  panel += `<div class="drawer" id="drawer-c1"><b>Source:</b> STRUC_I_SUMMARY.csv × STRUC-PERC-I AuditRepair batch results, joined on case_id<br><b>Cases:</b> ${pts.length}<br><b>Frozen input verification:</b> PASS</div>`;
  panel += `</div>`;
  return panel;
}
function chartKappaStripPanel(cases, stats){
  // Per-case dots (not mean-only bars): with n=6/class, a mean bar hides real
  // within-class spread (esp. AFF_FREE). Show every point + a median tick.
  const classes = Object.keys(stats);
  const pts = cases.filter(c=>c.kappa_connect_exact!=null);
  const maxVal = Math.max(...pts.map(p=>p.kappa_connect_exact), 0.001);
  const W=300,H=190,padL=26,padB=40,padT=14,padR=10;
  const bw = (W-padL-padR)/classes.length;
  const sy = v => H-padB - (v/maxVal)*(H-padT-padB);
  let s = `<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#0e2035"/>`;
  classes.forEach((c,i)=>{
    const cx = padL + i*bw + bw*0.5;
    const classPts = pts.filter(p=>p.class===c);
    // deterministic small jitter so overlapping equal values stay visible
    classPts.forEach((p,j)=>{
      const jitter = (j - (classPts.length-1)/2) * (bw*0.11);
      s += `<circle cx="${(cx+jitter).toFixed(1)}" cy="${sy(p.kappa_connect_exact).toFixed(1)}" r="3" fill="${CLASS_COLORS[c]||'#6080a0'}" fill-opacity="0.85"><title>${p.case_id}: κ=${p.kappa_connect_exact}</title></circle>`;
    });
    const med = stats[c].median;
    s += `<line x1="${(cx-bw*0.32).toFixed(1)}" y1="${sy(med).toFixed(1)}" x2="${(cx+bw*0.32).toFixed(1)}" y2="${sy(med).toFixed(1)}" stroke="var(--text)" stroke-width="1.4"/>`;
    s += `<text x="${cx.toFixed(1)}" y="${H-padB+11}" font-size="6.3" fill="#6080a0" font-family="monospace" text-anchor="middle">${c}</text>`;
  });
  let panel = `<div class="panel"><div class="panel-title">κ_connect_exact by class — all 6 points + median <button class="drawer-btn" onclick="toggleDrawer('drawer-c2')">SOURCE</button></div>`;
  panel += `<svg class="svgpanel" viewBox="0 0 ${W} ${H}">${s}</svg>`;
  panel += classLegend();
  panel += `<div class="legend"><span><i style="background:var(--text);height:2px;width:10px"></i>class median</span></div>`;
  panel += `<div class="caution">Individual points (not a mean bar) so within-class spread is visible — e.g. AFF_FREE ranges widely while R1_FREE/R1_FAIL each collapse to a single value.</div>`;
  panel += `<div class="drawer" id="drawer-c2"><b>Source:</b> STRUC-PERC-I AuditRepair/struc_perc_audit_v2_5_1_batch_results.csv, grouped by CORPUS_INDEX class<br><b>Frozen input verification:</b> PASS</div>`;
  panel += `</div>`;
  return panel;
}
function chartVerdictComparisonPanel(v250, v251){
  const cats = Array.from(new Set([...Object.keys(v250), ...Object.keys(v251)]));
  const maxN = Math.max(...cats.map(c=>Math.max(v250[c]||0, v251[c]||0)), 1);
  const W=300,H=190,padL=26,padB=40,padT=14,padR=10;
  const groupW = (W-padL-padR)/cats.length;
  let s = `<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#0e2035"/>`;
  const colors = {FULL_PERCOLATION:'#00dd88', HARD_FRAGMENTATION:'#e04040', TAIL_FRAGMENTATION:'#f0a030'};
  cats.forEach((c,i)=>{
    const gx = padL + i*groupW;
    const bw = groupW*0.32;
    const h0 = ((v250[c]||0)/maxN)*(H-padT-padB);
    const h1 = ((v251[c]||0)/maxN)*(H-padT-padB);
    s += `<rect x="${(gx+groupW*0.1).toFixed(1)}" y="${(H-padB-h0).toFixed(1)}" width="${bw.toFixed(1)}" height="${h0.toFixed(1)}" fill="${colors[c]||'#6080a0'}" fill-opacity="0.45"/>`;
    s += `<rect x="${(gx+groupW*0.1+bw+2).toFixed(1)}" y="${(H-padB-h1).toFixed(1)}" width="${bw.toFixed(1)}" height="${h1.toFixed(1)}" fill="${colors[c]||'#6080a0'}" fill-opacity="0.95"/>`;
    s += `<text x="${(gx+groupW/2).toFixed(1)}" y="${H-padB+10}" font-size="6" fill="#6080a0" font-family="monospace" text-anchor="middle">${c.replace('_',' ').slice(0,14)}</text>`;
    s += `<text x="${(gx+groupW*0.1+bw/2).toFixed(1)}" y="${(H-padB-h0-3).toFixed(1)}" font-size="6.5" fill="var(--text2)" font-family="monospace" text-anchor="middle">${v250[c]||0}</text>`;
    s += `<text x="${(gx+groupW*0.1+bw+2+bw/2).toFixed(1)}" y="${(H-padB-h1-3).toFixed(1)}" font-size="6.5" fill="var(--text)" font-family="monospace" text-anchor="middle">${v251[c]||0}</text>`;
  });
  let panel = `<div class="panel"><div class="panel-title">Original bounded/adaptive tiers vs exact eventual-connectivity audit <button class="drawer-btn" onclick="toggleDrawer('drawer-c3')">SOURCE</button></div>`;
  panel += `<svg class="svgpanel" viewBox="0 0 ${W} ${H}">${s}</svg>`;
  panel += `<div class="legend"><span><i style="background:#6080a0;opacity:.45"></i>v2.5.0 base (bounded/adaptive search)</span><span><i style="background:#6080a0"></i>v2.5.1 exact-threshold audit</span></div>`;
  panel += `<div class="caution">v2.5.1 deliberately probes the exact finite-graph connectivity threshold, so 30/30 FULL_PERCOLATION is an <b style="color:var(--text)">eventual-connectivity audit</b>, not a directly comparable "improved classifier." The informative variable is κ_connect_exact (previous chart), not this verdict count.</div>`;
  panel += `<div class="drawer" id="drawer-c3"><b>Source:</b> struc_perc_i/struc_perc_batch_results.csv (v2.5.0) vs STRUC-PERC-I AuditRepair/struc_perc_audit_v2_5_1_batch_results.csv<br><b>Cases:</b> 30 each<br><b>Frozen input verification:</b> PASS</div>`;
  panel += `</div>`;
  return panel;
}
function classLegend(){
  return `<div class="legend">`+Object.entries(CLASS_COLORS).map(([k,v])=>`<span><i style="background:${v}"></i>${k}</span>`).join('')+`</div>`;
}

// ================= §7 MANUSCRIPT / CLAIM–EVIDENCE MAP =================
function gradeBadge(grade){
  const g = (grade||'').toUpperCase();
  if(g==='THEOREM' || g==='THEOREM + COMPUTATION' || g==='LEAN KERNEL VERIFIED'){
    return `<span class="v-pass">${esc(grade)}</span>`;
  }
  if(g==='SOURCE-AUDITED CANDIDATE PROOF' || g==='VERIFIED PILOT COMPUTATION'){
    return `<span class="v-partial">${esc(grade)}</span>`;
  }
  // STRUCTURAL INTERPRETATION and anything else: distinct grade, not a failure/open item
  return `<span class="v-partial" style="color:var(--violet);border-color:var(--violet);background:rgba(140,120,240,.08)">${esc(grade)}</span>`;
}
function renderManuscript(){
  const el = document.getElementById('panel-manuscript');
  const rows = DATA.manuscript_map || [];
  let h = `<div class="sec-label"><span style="color:var(--accent)">§7</span> MANUSCRIPT / CLAIM–EVIDENCE MAP</div>`;
  h += `<div class="panel"><div class="panel-title">CLAIM → EVIDENCE GRADE <span class="psub">click a figure/table reference to jump to its section · SOURCE opens the backing records</span></div>`;
  h += `<p style="font-size:10.5px;color:var(--text2);line-height:1.8;margin-bottom:14px">`+
       `This table is the control surface for turning this project into a manuscript: every claim it would make is pinned to an `+
       `explicit evidence grade — <b style="color:var(--text)">THEOREM</b>, <b style="color:var(--text)">THEOREM + COMPUTATION</b>, `+
       `<b style="color:var(--text)">LEAN KERNEL VERIFIED</b>, <b style="color:var(--violet)">SOURCE-AUDITED CANDIDATE PROOF</b>, `+
       `<b style="color:var(--violet)">VERIFIED PILOT COMPUTATION</b>, or <b style="color:var(--violet)">STRUCTURAL INTERPRETATION</b> — `+
       `so theorem-level results, Lean-verified mechanism, source-audited candidate proof, pilot-scale computation, and `+
       `interpretive synthesis are never silently mixed together.</p>`;
  h += `<div class="scrollbox"><table class="dt"><thead><tr>`+
       `<th>Manuscript claim</th><th>Evidence grade</th><th>Basis</th><th>Figure / table</th>`+
       `</tr></thead><tbody>`;
  rows.forEach(row=>{
    const sd = sourceDrawer(row.sources);
    h += `<tr>`+
         `<td>${esc(row.claim)}</td>`+
         `<td>${gradeBadge(row.grade)}</td>`+
         `<td style="color:var(--text2);font-size:9.5px">${esc(row.grade_note)} ${sd.btn}${sd.drawer}</td>`+
         `<td><a href="javascript:void(0)" onclick="selectTab('${row.figure_tab}')" style="color:var(--accent);text-decoration:none">${esc(row.figure_label)} →</a></td>`+
         `</tr>`;
  });
  h += `</tbody></table></div>`;
  h += `<div class="caution">Evidence grades are ordered by epistemic strength, not by importance to the theory: a STRUCTURAL INTERPRETATION `+
       `row (e.g. the three-coordinate reading of route closure / admissibility / percolation scale) is a synthesis claim, not a weaker `+
       `version of a theorem — it should be presented as interpretation in any manuscript draft, not as a proved result.</div>`;
  h += `</div>`;
  el.innerHTML = h;
}
