<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNNS Vacuum Continuity — Research Analytics</title>
<style>
:root{
  --bg:#040810;--bg2:#060c16;--panel:#07101e;--panel2:#0a1628;
  --border:#0e2035;--border2:#0c1a2e;
  --accent:#00c8f0;--green:#00dd88;--amber:#f0a030;--red:#e04040;
  --blue:#4ab0f0;--violet:#9060e0;--gold:#d4a020;--coral:#e06040;
  --text:#b8cce0;--text2:#6080a0;--dim:#3a5070;
  --sans:'Trebuchet MS',sans-serif;--mono:'Courier New',monospace;--display:'Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.6}
.shell{max-width:1440px;margin:0 auto;padding:32px 32px 120px}

.hero{border-bottom:1px solid var(--border);padding-bottom:24px;margin-bottom:24px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 50% 120% at 90% 50%,rgba(0,200,240,.06),transparent);pointer-events:none}
.hero-eye{font-size:8px;color:var(--text2);letter-spacing:.18em;font-weight:700;margin-bottom:10px;font-family:var(--mono)}
.hero h1{font-family:var(--display);font-size:clamp(18px,2.8vw,30px);color:var(--accent);letter-spacing:.06em;line-height:1.1;margin-bottom:8px}
.hero-sub{font-size:12px;color:var(--text2);letter-spacing:.04em;max-width:860px;margin-bottom:14px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.badge{font-size:8px;font-family:var(--mono);letter-spacing:.1em;padding:3px 10px;border:1px solid;border-radius:2px}
.b-green{color:var(--green);border-color:var(--green);background:rgba(0,221,136,.07)}
.b-blue{color:var(--blue);border-color:var(--blue);background:rgba(74,176,240,.07)}
.b-amber{color:var(--amber);border-color:var(--amber);background:rgba(240,160,48,.07)}
.b-violet{color:var(--violet);border-color:var(--violet);background:rgba(144,96,224,.07)}
.b-red{color:var(--red);border-color:var(--red);background:rgba(224,64,64,.07)}
.b-dim{color:var(--dim);border-color:var(--dim);background:transparent}

.tabbar{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--border);margin-bottom:22px;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:4px}
.tab{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--text2);padding:10px 14px;cursor:pointer;border:1px solid transparent;border-bottom:none;background:var(--panel);white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-color:var(--border2);background:var(--panel2);position:relative}
.tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--panel2)}
.tabpanel{display:none}
.tabpanel.active{display:block}

.sec-label{font-size:8px;color:var(--dim);letter-spacing:.2em;font-weight:700;padding:5px 0 10px;border-top:1px solid var(--border2);margin-top:32px;margin-bottom:16px;display:flex;align-items:center;gap:12px;font-family:var(--mono)}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border2)}
.sec-label:first-child{margin-top:0;border-top:none}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--border2);padding:12px 14px}
.stat-val{font-family:var(--display);font-size:20px;line-height:1.15;margin-bottom:3px}
.stat-lbl{font-size:8px;color:var(--text2);letter-spacing:.06em;font-family:var(--mono)}

.panel{background:var(--panel);border:1px solid var(--border2);padding:16px 20px;margin-bottom:14px}
.panel-title{font-size:8px;color:var(--accent);letter-spacing:.14em;font-weight:700;border-bottom:1px solid var(--border2);padding-bottom:8px;margin-bottom:12px;font-family:var(--mono);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.psub{color:var(--dim);font-weight:400;text-transform:none;letter-spacing:0}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.row2>*,.row3>*{min-width:0}
@media(max-width:1000px){.row2,.row3{grid-template-columns:1fr}}

.scrollbox{overflow-x:auto;border:1px solid var(--border2)}
.dt{width:100%;border-collapse:collapse;font-size:9.5px}
.dt th{color:var(--accent);letter-spacing:.08em;font-weight:700;padding:6px 10px;border-bottom:1px solid var(--border2);text-align:left;white-space:nowrap;background:var(--panel2);font-family:var(--mono);position:sticky;top:0}
.dt td{padding:5px 10px;border-bottom:1px solid var(--border2);font-family:var(--mono);white-space:nowrap}
.dt tr:hover td{background:rgba(0,200,240,.04)}
.dt tr.clickable{cursor:pointer}
.dt tr.hl td{background:rgba(224,64,64,.07)}

.v-yes{color:var(--green);font-weight:700}
.v-no{color:var(--red);font-weight:700}
.v-pass{color:var(--green);border:1px solid var(--green);background:rgba(0,221,136,.08);padding:2px 7px;border-radius:2px;font-size:8px;letter-spacing:.08em}
.v-partial{color:var(--amber);border:1px solid var(--amber);background:rgba(240,160,48,.08);padding:2px 7px;border-radius:2px;font-size:8px;letter-spacing:.08em}
.v-open{color:var(--red);border:1px solid var(--red);background:rgba(224,64,64,.08);padding:2px 7px;border-radius:2px;font-size:8px;letter-spacing:.08em}
.v-interp{color:var(--violet);border:1px solid var(--violet);background:rgba(144,96,224,.08);padding:2px 7px;border-radius:2px;font-size:8px;letter-spacing:.08em}

.detail-row td{background:var(--panel2);font-family:var(--sans);font-size:10.5px;white-space:normal;padding:14px 16px}
.detail-grid{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;font-size:10px}
.detail-grid dt{color:var(--dim);font-family:var(--mono);letter-spacing:.06em}
.detail-grid dd{color:var(--text)}

.ladder{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.ladder-step{display:grid;grid-template-columns:260px 300px 1fr;gap:12px;align-items:center;padding:9px 14px;border:1px solid var(--border2);background:var(--panel2)}
.ladder-lv{font-family:var(--display);font-size:11px;color:var(--text)}
.ladder-desc{font-size:9.5px;color:var(--text2)}
.ladder-tag{font-size:8px;font-family:var(--mono);letter-spacing:.08em;padding:2px 8px;border-radius:2px;white-space:normal}
@media(max-width:1000px){.ladder-step{grid-template-columns:1fr}}

.pipeline{display:flex;flex-wrap:wrap;align-items:center;gap:0;font-family:var(--mono);font-size:8.5px;margin:10px 0}
.pipe-step{background:var(--panel2);border:1px solid var(--border2);padding:6px 10px;color:var(--text)}
.pipe-step.active{border-color:var(--accent);color:var(--accent)}
.pipe-step.red{border-color:var(--red);color:var(--red)}
.pipe-step.green{border-color:var(--green);color:var(--green)}
.pipe-arrow{color:var(--dim);padding:0 6px}

.special-banner{border:1px solid var(--amber);border-left:3px solid var(--amber);background:rgba(240,160,48,.05);padding:12px 16px;margin-bottom:14px}
.special-title{font-size:12px;font-weight:700;color:var(--amber);margin-bottom:5px;font-family:var(--mono)}
.special-banner.violet{border-color:var(--violet)}
.special-banner.violet .special-title{color:var(--violet)}
.special-banner.green{border-color:var(--green)}
.special-banner.green .special-title{color:var(--green)}
.special-banner.red{border-color:var(--red)}
.special-banner.red .special-title{color:var(--red)}

.caution{font-size:9px;color:var(--dim);border-top:1px solid var(--border2);margin-top:10px;padding-top:8px;font-family:var(--mono)}
.svgpanel{width:100%;height:auto;background:var(--panel2);border:1px solid var(--border2)}
.prose{font-size:10.5px;color:var(--text);line-height:1.85}
.prose b{color:var(--accent);font-weight:700}
code{color:var(--accent);font-family:var(--mono);font-size:.95em}

.drawer-btn{font-family:var(--mono);font-size:8px;letter-spacing:.08em;color:var(--text2);border:1px solid var(--border2);background:transparent;padding:2px 8px;cursor:pointer;border-radius:2px}
.drawer-btn:hover{color:var(--accent);border-color:var(--accent)}
.drawer{display:none;background:var(--bg2);border:1px solid var(--border2);border-left:3px solid var(--accent);padding:10px 14px;margin-top:8px;font-family:var(--mono);font-size:9.5px;color:var(--text2);line-height:1.9;font-weight:400;letter-spacing:0;text-transform:none;width:100%}
.drawer.open{display:block}
.drawer b{color:var(--accent);font-weight:400}

.chip{font-size:8px;font-family:var(--mono);padding:1px 6px;border:1px solid var(--border2);border-radius:2px;color:var(--text2)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:8.5px;font-family:var(--mono);color:var(--text2);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;display:inline-block;border-radius:1px}
.eq{font-family:var(--mono);color:var(--text);background:var(--panel2);border:1px solid var(--border2);padding:8px 14px;margin:8px 0;font-size:11px;text-align:center}
footer.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--border2);font-size:8px;color:var(--dim);font-family:var(--mono);line-height:1.8}
</style>
</head>
<body>
<div class="shell">

<div class="hero">
  <div class="hero-eye">UNNS SUBSTRATE RESEARCH PROGRAM · UNNS_YM_GAP → UNNS_VACUUM_CONTINUITY · SELF-CONTAINED BUILD</div>
  <h1 id="hero-title">UNNS Vacuum Continuity — Research Analytics</h1>
  <div class="hero-sub" id="hero-sub"></div>
  <div class="badges" id="hero-badges"></div>
  <div class="hero-sub" id="hero-meta" style="font-family:var(--mono);font-size:9px"></div>
</div>

<div class="tabbar" id="tabbar"></div>

<div id="panel-overview" class="tabpanel"></div>
<div id="panel-ymgap" class="tabpanel"></div>
<div id="panel-access" class="tabpanel"></div>
<div id="panel-spectral" class="tabpanel"></div>
<div id="panel-synthesis" class="tabpanel"></div>
<div id="panel-claims" class="tabpanel"></div>
<div id="panel-provenance" class="tabpanel"></div>

<footer class="foot" id="foot"></footer>

</div>

<script>
const DATA = /*__DATA__*/null;

// ---------- helpers ----------
function esc(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function fmt(n, d){ if(n===null||n===undefined||Number.isNaN(n)) return '—'; if(typeof n!=='number') return esc(n); return n.toFixed(d===undefined?4:d); }
function fmtS(n, d){ if(typeof n!=='number') return esc(n); return (n>=0?'+':'')+n.toFixed(d===undefined?4:d); }
function fmtInt(n){ if(n===null||n===undefined) return '—'; return Number(n).toLocaleString(); }
function stat(val, lbl, color, tip){ return `<div class="stat"${tip?` title="${esc(tip)}"`:''}><div class="stat-val" style="${color?`color:${color}`:''}">${esc(val)}</div><div class="stat-lbl">${esc(lbl)}</div></div>`; }
const PROV = {}; (DATA.reproducibility.provenance||[]).forEach(p=>{ PROV[p.path]=p; });
let __seq = 0;
function sourceDrawer(paths){
  if(!paths||!paths.length) return {btn:'',drawer:''};
  const id='src-'+(__seq++);
  const rows = paths.map(p=>{ const i=PROV[p]; return i ? `${esc(p)} — sha256 ${esc(i.sha256.slice(0,16))}… (${fmtInt(i.bytes)} bytes)` : `${esc(p)} — (not in provenance manifest)`; }).join('<br>');
  return {btn:`<button class="drawer-btn" onclick="toggleDrawer('${id}')">SOURCE</button>`,
          drawer:`<div class="drawer" id="${id}"><b>Source:</b><br>${rows}<br><b>Build:</b> ${esc(DATA.reproducibility.build_timestamp_utc)}<br><b>Build provenance:</b> HASHED</div>`};
}
function toggleDrawer(id){ document.getElementById(id).classList.toggle('open'); }
const G='UNNS_YM_GAP/', V='UNNS_VACUUM_CONTINUITY/';

// ---------- tabs ----------
const TABS = [
  {id:'overview', label:'§1 PROJECT OVERVIEW'},
  {id:'ymgap', label:'§2 YM_GAP · NON-CROSSABILITY'},
  {id:'access', label:'§3 STAGE 2 · STRUCTURAL ACCESSIBILITY'},
  {id:'spectral', label:'§4 STAGE 3 · SPECTRAL SCALE & BRIDGE-III'},
  {id:'synthesis', label:'§5 STRUCTURAL ≠ SPECTRAL'},
  {id:'claims', label:'§6 CLAIM–EVIDENCE MAP'},
  {id:'provenance', label:'§7 REPRODUCIBILITY / PROVENANCE'},
];
function initTabs(){
  const bar=document.getElementById('tabbar');
  TABS.forEach((t,i)=>{ const el=document.createElement('div'); el.className='tab'+(i===0?' active':''); el.textContent=t.label; el.onclick=()=>selectTab(t.id); el.id='tab-'+t.id; bar.appendChild(el); });
  selectTab('overview');
}
function selectTab(id){ TABS.forEach(t=>{ document.getElementById('tab-'+t.id).classList.toggle('active',t.id===id); document.getElementById('panel-'+t.id).classList.toggle('active',t.id===id); }); window.scrollTo({top:0}); }
function toggleRow(id){ const r=document.getElementById(id); r.style.display = r.style.display==='none' ? '' : 'none'; }

// ---------- generic SVG charts ----------
const C = {accent:'#00c8f0',green:'#00dd88',amber:'#f0a030',red:'#e04040',blue:'#4ab0f0',violet:'#9060e0',text:'#b8cce0',t2:'#6080a0',dim:'#3a5070',grid:'#0e2035'};
function niceTicks(lo,hi,n){ const span=hi-lo, step0=span/n, mag=Math.pow(10,Math.floor(Math.log10(step0))); const f=step0/mag; const step=(f<1.5?1:f<3?2:f<7?5:10)*mag; const t=[]; for(let v=Math.ceil(lo/step)*step; v<=hi+1e-12; v+=step) t.push(+v.toFixed(10)); return t; }
function axes(W,H,p,xlo,xhi,ylo,yhi,xl,yl,xticks,yd){
  const sx=x=>p.l+(x-xlo)/(xhi-xlo)*(W-p.l-p.r), sy=y=>H-p.b-(y-ylo)/(yhi-ylo)*(H-p.t-p.b);
  let s=`<line x1="${p.l}" y1="${H-p.b}" x2="${W-p.r}" y2="${H-p.b}" stroke="${C.grid}"/><line x1="${p.l}" y1="${p.t}" x2="${p.l}" y2="${H-p.b}" stroke="${C.grid}"/>`;
  niceTicks(ylo,yhi,5).forEach(v=>{ s+=`<line x1="${p.l}" y1="${sy(v)}" x2="${W-p.r}" y2="${sy(v)}" stroke="${C.grid}" stroke-dasharray="1,3"/><text x="${p.l-4}" y="${sy(v)+3}" font-size="8" fill="${C.t2}" font-family="monospace" text-anchor="end">${(+v.toFixed(yd===undefined?3:yd))}</text>`; });
  (xticks||niceTicks(xlo,xhi,6)).forEach(v=>{ s+=`<text x="${sx(v)}" y="${H-p.b+12}" font-size="8" fill="${C.t2}" font-family="monospace" text-anchor="middle">${(+(+v).toFixed(4))}</text>`; });
  s+=`<text x="${(p.l+W-p.r)/2}" y="${H-4}" font-size="8" fill="${C.t2}" font-family="monospace" text-anchor="middle">${esc(xl)}</text>`;
  s+=`<text x="10" y="${(p.t+H-p.b)/2}" font-size="8" fill="${C.t2}" font-family="monospace" text-anchor="middle" transform="rotate(-90 10 ${(p.t+H-p.b)/2})">${esc(yl)}</text>`;
  return {s,sx,sy};
}

// ================= §1 OVERVIEW =================
function renderOverview(){
  const el=document.getElementById('panel-overview'), g=DATA.gap, v=DATA.vc;
  let h=`<div class="sec-label"><span style="color:var(--accent)">§1</span> WHAT THE TWO PROJECTS ESTABLISHED TOGETHER</div>`;
  h+=`<div class="stat-grid">`;
  h+=stat(g.ym3.length,'AT20 REFINEMENT LEVELS (YM-3A)');
  h+=stat(g.ym3.length*5,'MATCHED GAMMA CONTROLS (8 β × p∈{0.5,1,2,4,8})');
  h+=stat(g.ym3b.length,'CLASS-B β LEVELS (YM-3B)');
  h+=stat(fmtS(g.ym3b.find(r=>r.beta===6.71).S_B,6),'S_B AT β = 6.71 (CENTRAL CROSSING)','var(--red)');
  h+=stat(6,'STAGE-2 STRUCTURAL BRANCHES');
  h+=stat('0 / 7','FALSIFICATION ROUTES F1–F7 TRIGGERED (NO FALSIFIER ESTABLISHED)','var(--green)','F1–F4, F6, F7 recorded as "not observed"; F5 as "not supported by the evidence" (STAGE2_SYNTHESIS.md §3)');
  h+=stat(2,'INDEPENDENT SPECTRAL BRANCHES (POSITIVE)','var(--green)');
  h+=stat(Object.values(v.bridge.checks).filter(Boolean).length+' / '+Object.keys(v.bridge.checks).length,'BRIDGE-III DETERMINISTIC CHECKS','var(--green)');
  h+=`</div>`;

  h+=`<div class="panel"><div class="panel-title">THEORY-CORRECTION CYCLE <span class="psub">hypothesis → empirical failure → successor hypothesis → coexistence</span></div>`;
  h+=`<div class="pipeline" style="font-size:9.5px"><span class="pipe-step red">non-crossability hypothesis</span><span class="pipe-arrow">→</span><span class="pipe-step red">not established (YM-3B DATA-INDETERMINATE)</span><span class="pipe-arrow">→</span><span class="pipe-step active">vacuum-continuity hypothesis</span><span class="pipe-arrow">→</span><span class="pipe-step green">structural / spectral coexistence</span></div>`;
  h+=`<div class="eq">mass gap  ⇔  structural vacuum non-crossability   —   NOT ESTABLISHED  (failure to establish, not disproof)</div>`;
  h+=`<div class="eq" style="color:var(--green)">structural vacuum accessibility   can coexist with   E₁ − E₀ &gt; 0</div><div class="caution" style="border:none;margin-top:2px">The corresponding closure-limit form, D_struct(X<sub>n</sub>, V) → 0, remains consistent with — but is not proved by — the data.</div>`;
  h+=`</div>`;

  const ladder=[
    {level:'YM-2 · CORR-I diagnostic',status:'DIAGNOSTIC ESTABLISHED; REFINEMENT TEST REQUIRED',color:'blue',detail:'Massive plateau control separates from every gapless Gamma-family control at fixed resolution (β = 6.50: R_massive vs R_p=8 → 4.9×).',src:[G+'README.md',G+'output/ym3/YM3_SUMMARY.csv']},
    {level:'YM-3A · Class C refinement',status:'MODEL-REFINEMENT PERSISTENT',color:'green',detail:'S_fixed > 0 and S_match > 0 at all 8 AT20 levels, matched ordering retained. Exact mass-anchored model controls only — not measured correlators.',src:[G+'docs/YM3_RESULT.md',G+'output/ym3/YM3_SUMMARY.csv']},
    {level:'YM-3B · Class B measured data',status:'DATA-INDETERMINATE',color:'amber',detail:'Central trajectory crosses the boundary once (β = 6.71, S_B = −0.003395); 95% interval [−0.027454, +0.019320] spans both signs.',src:[G+'docs/YM3B_RESULT.md',G+'output/ym3b/YM3B_SUMMARY.csv',G+'output/ym3b/YM3B_UNCERTAINTY_SUMMARY.csv']},
    {level:'UNNS_YM_GAP · closure',status:'CENTRAL HYPOTHESIS NOT ESTABLISHED',color:'red',detail:'Universal structural non-crossability not supported. No structural→Hamiltonian bridge reached; YM-4 cancelled.',src:[G+'FINAL_STATUS.md',G+'docs/CLOSURE_RECORD.json']},
    {level:'Stage 2 · structural accessibility',status:'NO-UNIVERSAL-STRUCTURAL-EXCLUSION-DETECTED → STRUCTURAL-VACUUM-ACCESSIBILITY-SUPPORTED',color:'green',detail:'Six branches, three representations, three source geometries: no positive structural floor detected. Underlying verdicts stay limited (calibration-, refinement-, uncertainty-limited).',src:[V+'stage2/STAGE2_STATUS.md',V+'stage2/STAGE2_SYNTHESIS.md']},
    {level:'Stage 3 · spectral scale',status:'SPECTRAL-SCALE-POSITIVE (×2, independent)',color:'green',detail:'A: M(0++)/√σ = 3.405 ± 0.021. B: r₀M(0++) = 4.16(11)(4); conservative lower bound 4.01 > 0.',src:[V+'output/spec_i_a/SPEC_I_A_RESULT.md',V+'output/spec_i_b/SPEC_I_B_RESULT.md']},
    {level:'BRIDGE-III → Stage 3',status:'COEXISTENCE-SUPPORTED → STRUCTURAL-SPECTRAL-COEXISTENCE-SUPPORTED',color:'green',detail:'All structural, spectral and theory-match gates PASS. No earlier verdict modified. No mass-gap or vacuum-closure theorem claimed.',src:[V+'output/bridge_iii/BRIDGE_III_RESULT.md',V+'stage3/BRIDGE_III_LOCK.md',V+'stage3/PROJECT_CLOSURE.md']},
  ];
  h+=`<div class="panel"><div class="panel-title">EVIDENCE LADDER <span class="psub">SOURCE opens the backing records (sha256 computed at build time)</span></div><div class="ladder">`;
  ladder.forEach(s=>{
    const cv={green:'var(--green)',amber:'var(--amber)',blue:'var(--blue)',red:'var(--red)'}[s.color];
    const sd=sourceDrawer(s.src);
    h+=`<div class="ladder-step" style="border-left:3px solid ${cv}"><span class="ladder-lv">${esc(s.level)}</span><span class="ladder-tag" style="color:${cv};border:1px solid ${cv}">${esc(s.status)}</span><span class="ladder-desc">${esc(s.detail)} ${sd.btn}${sd.drawer}</span></div>`;
  });
  h+=`</div></div>`;

  const gain=[
    ['Is the vacuum protected by a universal structural wall?','Not established. The decisive measured-data trajectory crossed the proposed CORR-I boundary once; uncertainty left the verdict DATA-INDETERMINATE.','No universal positive floor detected across refinement, smoothing, EMT representation and geometry.','Structural non-crossability is not required by the evidence.'],
    ['Is the vacuum structurally approachable?','Failure of universal non-crossability motivated placing the vacuum inside the structural domain.','STRUCTURAL-VACUUM-ACCESSIBILITY-SUPPORTED.','Vacuum is better modelled as an internal limit / closure locus than as an exterior beyond structure.'],
    ['Does structural accessibility destroy the mass gap?','Not tested successfully; no structural→Hamiltonian bridge reached.','Tested independently through continuum glueball spectroscopy.','No. Structural accessibility and a positive spectral scale coexist.'],
    ['Is the positive spectral scale robust?','CORR-I discriminated massive from gapless controls — a structural diagnostic, not a mass-gap theorem.','Two independent continuum calculations returned SPECTRAL-SCALE-POSITIVE.','Spectral discreteness does not depend on the structural-boundary hypothesis.'],
    ['Final conceptual result','Original identification was not established.','BRIDGE-III = COEXISTENCE-SUPPORTED.','spectral separation ⇏ structural separation'],
  ];

  h+=`<p style="font-size:10.5px;color:var(--text2);line-height:1.8;margin-bottom:14px"><b style="color:var(--text)">FROZEN EMPIRICAL VERDICT</b> — preregistered chamber outcome, immutable. <b style="color:var(--text)">LIMITED EMPIRICAL VERDICT</b> — frozen but calibration-, refinement- or uncertainty-limited. <b style="color:var(--violet)">STRUCTURAL INTERPRETATION</b> — synthesis, not a weaker theorem. <b style="color:var(--red)">NOT ESTABLISHED / NOT CLAIMED</b> — explicitly outside the evidence.</p>`;
  h+=`<div class="scrollbox"><table class="dt"><thead><tr><th>Claim</th><th>Evidence grade</th><th>Basis</th><th>Where</th></tr></thead><tbody>`;
  rows.forEach(r=>{ const sd=sourceDrawer(r[5]); h+=`<tr><td style="white-space:normal;min-width:240px">${esc(r[0])}</td><td>${gradeBadge(r[1])}</td><td style="white-space:normal;color:var(--text2);font-size:9.5px">${esc(r[2])} ${sd.btn}${sd.drawer}</td><td><a href="javascript:void(0)" onclick="selectTab('${r[3]}')" style="color:var(--accent);text-decoration:none">${esc(r[4])} →</a></td></tr>`; });
  h+=`</tbody></table></div><div class="caution">All empirical claims are scoped to the tested pure-SU(3) corpus and representations. “Corpus-scoped empirical observation” is not “universal theorem”.</div></div>`;
  el.innerHTML=h;
}

// ================= §7 PROVENANCE =================
function renderProvenance(){
  const el=document.getElementById('panel-provenance'), r=DATA.reproducibility;
  const okChecks=r.checks.filter(c=>c.ok).length;
  const matched=r.hash_audit.filter(x=>x.match).length, mism=r.hash_audit.filter(x=>x.match===false).length, absent=r.hash_audit.filter(x=>x.match===null).length;
  let h=`<div class="sec-label"><span style="color:var(--accent)">§7</span> REPRODUCIBILITY &amp; PROVENANCE</div><div class="stat-grid">`;
  h+=stat(okChecks+' / '+r.checks.length,'VERDICT-STRING CHECKS vs SOURCE RECORDS',okChecks===r.checks.length?'var(--green)':'var(--red)');
  h+=stat(matched+' match · '+mism+' mismatch',mism?'MANIFEST SHA-256 AUDIT (MISMATCH PRESENT)':'FREEZE-MANIFEST SHA-256 AUDIT',mism?'var(--red)':'var(--green)');
  h+=stat(r.provenance.length,'SOURCE FILES USED / HASHED');
  h+=stat(r.missing_sources.length,'MISSING AT BUILD TIME',r.missing_sources.length?'var(--red)':'var(--green)');
  h+=`</div>`;
  h+=`<div class="panel"><div class="panel-title">HOW THIS PAGE WAS BUILT</div><p class="prose">All primary machine-result tables, charts, frozen verdicts and bridge statuses on this page are parsed from, or checked against, the project records. <code>analytics/BUILD_ANALYTICS.py</code> reads both projects' own frozen CSV / JSON / Markdown records, parses the values (including the AICc, Battelli STRUC-I and EMT component tables out of the Markdown reports), computes a fresh sha256 for every file, asserts that each verdict string quoted here actually occurs in the record it is attributed to, and embeds the dataset into this single file. No server, no <code>fetch()</code>, no CDN — it works offline. Derived quantities (relative-to-massive ratios, E<sub>R2</sub>/E<sub>R1</sub>) are computed in the page and labelled as derived. Explanatory prose may contain summary values reproduced from those records. The builder script and this template are themselves hashed in the manifest below.</p><div class="caution">Rebuild: <code>python analytics/BUILD_ANALYTICS.py</code> (expects <code>UNNS_YM_GAP</code> beside <code>UNNS_VACUUM_CONTINUITY</code>; or pass <code>--gap</code> / <code>--vc</code>).</div></div>`;

  h+=`<div class="panel"><div class="panel-title">VERDICT-STRING CHECKS</div><div class="scrollbox" style="max-height:300px;overflow-y:auto"><table class="dt"><thead><tr><th>check</th><th>result</th></tr></thead><tbody>`;
  r.checks.forEach(c=>{ h+=`<tr><td>${esc(c.name)}</td><td><span class="${c.ok?'v-pass':'v-open'}">${c.ok?'FOUND':'NOT FOUND'}</span></td></tr>`; });
  h+=`</tbody></table></div></div>`;

  h+=`<div class="panel"><div class="panel-title">FREEZE-MANIFEST HASH AUDIT <span class="psub">sha256 recorded in STAGE2_FREEZE.json / STAGE3_CLOSE_MANIFEST.json vs the file actually present</span></div><div class="scrollbox"><table class="dt"><thead><tr><th>manifest</th><th>file</th><th>recorded</th><th>result</th></tr></thead><tbody>`;
  r.hash_audit.forEach(x=>{ h+=`<tr><td>${esc(x.manifest)}</td><td>${esc(x.path)}</td><td style="color:var(--text2)">${esc(x.recorded.slice(0,16))}…</td><td class="${x.match?'v-yes':(x.match===false?'v-no':'')}">${x.match===null?'file not in this build':(x.match?'MATCH':'MISMATCH')}</td></tr>`; });
  h+=`</tbody></table></div></div>`;

  h+=`<div class="panel"><div class="panel-title">SOURCE MANIFEST <span class="psub">sha256 computed at build time, ${esc(r.build_timestamp_utc)}</span></div><div class="scrollbox" style="max-height:420px;overflow-y:auto"><table class="dt"><thead><tr><th>Path</th><th>bytes</th><th>sha256</th></tr></thead><tbody>`;
  r.provenance.forEach(p=>{ h+=`<tr><td>${esc(p.path)}</td><td>${fmtInt(p.bytes)}</td><td style="color:var(--text2)">${esc(p.sha256)}</td></tr>`; });
  h+=`</tbody></table></div>`;
  if(r.missing_sources.length) h+=`<div class="caution" style="color:var(--red)">MISSING AT BUILD TIME: ${r.missing_sources.map(esc).join(', ')}</div>`;
  h+=`</div>`;
  el.innerHTML=h;
}
